# =============================================================================
# Edge reverse proxy — single public entrypoint.
#
#   /            -> frontend container (static SPA)
#   /api/...     -> backend container  (Spring Boot)
#   /actuator/...-> backend container  (health/metrics, restricted)
#
# SSL is wired but commented: drop certs into /etc/nginx/certs and uncomment
# the 443 server + the HTTP->HTTPS redirect to go production-TLS.
# =============================================================================

upstream backend_upstream {
    server backend:8080;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

# ---- Shared security headers (applied per-location via include is not used;
# ---- headers are declared in each server to ensure they always emit) --------

map $sent_http_content_type $cache_control_static {
    default                 "no-cache";
    ~*application/javascript "public, max-age=31536000, immutable";
    ~*text/css               "public, max-age=31536000, immutable";
    ~*image/                 "public, max-age=2592000";
    ~*font/                  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    # ---- For production TLS, redirect everything to HTTPS instead: ----------
    # return 301 https://$host$request_uri;
    # }
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- Security headers ---------------------------------------------------
    add_header X-Frame-Options              "SAMEORIGIN"        always;
    add_header X-Content-Type-Options       "nosniff"           always;
    add_header X-XSS-Protection             "1; mode=block"     always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'" always;

    limit_conn conn_limit 20;

    # ---- API ----------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---- Actuator: liveness/readiness open, everything else internal-only ---
    location ~ ^/actuator/(health|info|prometheus) {
        proxy_pass         http://backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        # Lock down the rest of actuator to the internal docker network only.
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;
        proxy_pass         http://backend_upstream;
        proxy_set_header   Host $host;
    }

    # ---- Frontend SPA -------------------------------------------------------
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control     $cache_control_static;
    }
}
