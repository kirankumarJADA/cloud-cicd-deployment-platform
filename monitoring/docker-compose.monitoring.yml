# Optional observability add-on. Run alongside the production stack:
#
#   docker compose -f deployment/docker-compose.prod.yml \
#                   -f monitoring/docker-compose.monitoring.yml up -d
#
# Prometheus scrapes the backend's /actuator/prometheus endpoint (Micrometer).
# Grafana is pre-pointed at Prometheus as a datasource.

name: cloud-cicd-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ccd-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    expose:
      - "9090"
    networks: [appnet]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ccd-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"
    networks: [appnet]

volumes:
  promdata:
  grafanadata:

networks:
  appnet:
    external: true
    name: cloud-cicd-prod_appnet
