# Maven Wrapper configuration (distributionType=only-script).
# On first `./mvnw` invocation the script downloads the Maven distribution
# below into ~/.m2/wrapper and runs it. A clean clone therefore needs only a
# JDK 21 — Maven itself does NOT need to be installed.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
