# =============================================================================
# Production stack — runs on the Linux VM.
#
# Unlike docker/docker-compose.yml, this file does NOT build images. It pulls
# pre-built, tagged images that GitHub Actions pushed to the container registry,
# then runs them with restart policies, healthchecks and a persistent DB volume.
#
# Required environment (sourced from deployment/.env on the VM):
#   REGISTRY, IMAGE_OWNER, IMAGE_TAG,
#   DATABASE_NAME, DATABASE_USERNAME, DATABASE_PASSWORD,
#   JWT_SECRET, APP_VERSION
# =============================================================================

name: cloud-cicd-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ccd-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [appnet]

  backend:
    image: ${REGISTRY}/${IMAGE_OWNER}/cloud-cicd-backend:${IMAGE_TAG}
    container_name: ccd-backend
    restart: always
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENVIRONMENT: production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [appnet]

  frontend:
    image: ${REGISTRY}/${IMAGE_OWNER}/cloud-cicd-frontend:${IMAGE_TAG}
    container_name: ccd-frontend
    restart: always
    pull_policy: always
    depends_on:
      - backend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: ccd-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"   # enable when TLS certs are mounted
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - /etc/letsencrypt/live/your-domain:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

volumes:
  pgdata:
    driver: local

networks:
  appnet:
    driver: bridge
