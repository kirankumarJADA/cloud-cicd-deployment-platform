# Local development stack.
# Usage:
#   cd docker && cp ../.env.example .env && docker compose up --build
#
# Services:
#   postgres  — database with a persistent named volume
#   backend   — Spring Boot API (built from ../backend)
#   frontend  — React SPA served by nginx (built from ../frontend)
#   nginx     — edge reverse proxy: single entrypoint on :8080

name: cloud-cicd-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ccd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-appdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-appuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-appuser} -d ${DATABASE_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ccd-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-appdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-appuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      APP_VERSION: ${APP_VERSION:-1.0.0-dev}
      APP_ENVIRONMENT: development
    expose:
      - "8080"
    networks: [appnet]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ccd-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: ccd-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

volumes:
  pgdata:
    driver: local

networks:
  appnet:
    driver: bridge
